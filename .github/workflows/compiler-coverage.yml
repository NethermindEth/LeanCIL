name: Compiler coverage (advisory)

on:
  schedule:
    - cron: '19 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest:
    name: Latest stable Roslyn admission (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet build Extractor -c Release
      - name: Compare latest stable compiler with pinned admission
        run: dotnet run --file Tests/CompilerCoverage.cs -- --latest --whole-only
      - name: Summarize coverage
        if: always()
        shell: bash
        run: |
          if test -f artifacts/CompilerCoverageLatest/summary.md; then
            cat artifacts/CompilerCoverageLatest/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f artifacts/CompilerCoverageLatest/changes.txt; then
            printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/CompilerCoverageLatest/changes.txt >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: latest-compiler-coverage
          path: |
            artifacts/CompilerCoverageLatest/**/*.json
            artifacts/CompilerCoverageLatest/*.tsv
            artifacts/CompilerCoverageLatest/*.md
            artifacts/CompilerCoverageLatest/*.txt
          retention-days: 1
