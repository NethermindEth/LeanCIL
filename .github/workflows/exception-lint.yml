name: Exception documentation lint (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exception-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Exception lint
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Run exceptionlint suite
        run: dotnet run --file scripts/Test.cs -- --suite exceptionlint
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exceptionlint-${{ github.run_attempt }}
          path: artifacts/test-results-exceptionlint.json
          if-no-files-found: ignore
          retention-days: 14
