name: Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: Verify (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        suite: [core, contracts, cli, integer, narrow, primitive, division, checked, conversions, native, arguments, layout, copy, bits, enums, nested, instance, constructors, fsharp, math, unsafe, blocks, generics, loops, evidence]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          # scripts/Test.cs handles building and testing.
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Run verification suite
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          dotnet run --file scripts/Test.cs -- --suite ${{ matrix.suite }} 2>&1 | tee artifacts/verification.log

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-results-${{ matrix.suite }}
          path: |
            artifacts/verification.log
            artifacts/test-results-*.json
            artifacts/**/verified.json
            artifacts/**/identity.json
            artifacts/**/Extracted.lean
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Build and verify
    needs: suites
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification suite to pass
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
        run: test "$SUITES_RESULT" = success
