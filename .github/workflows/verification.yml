name: Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select verification suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-suites: ${{ steps.select.outputs.has-suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test suite selection
        run: python3 scripts/test-select-verification.py
      - name: Select affected suites
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/select-verification.py --event "$EVENT" --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"

  suites:
    name: Verify (${{ matrix.suite }})
    needs: select
    if: needs.select.outputs.has-suites == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Consumer tests fetch this checkout as a pinned local Git dependency.
          # Git refuses shallow source roots when Lake materializes that dependency.
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install Lean toolchain
        uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1.6.2
        with:
          # scripts/Test.cs handles building and testing.
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false

      - name: Run verification suite
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          dotnet run --file scripts/Test.cs -- --suite ${{ matrix.suite }} 2>&1 | tee artifacts/verification.log

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-results-${{ matrix.suite }}
          path: |
            artifacts/verification.log
            artifacts/test-results-*.json
            artifacts/**/verified.json
            artifacts/**/identity.json
            artifacts/**/Extracted.lean
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Build and verify
    needs: [select, suites]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful selection and every selected suite to pass
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          HAS_SUITES: ${{ needs.select.outputs.has-suites }}
          SUITES_RESULT: ${{ needs.suites.result }}
        run: |
          test "$SELECT_RESULT" = success
          if [ "$HAS_SUITES" = true ]; then
            test "$SUITES_RESULT" = success
          else
            test "$HAS_SUITES" = false
            test "$SUITES_RESULT" = skipped
          fi
