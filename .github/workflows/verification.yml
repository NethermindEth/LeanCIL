name: Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select verification suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-suites: ${{ steps.select.outputs.has-suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test verification helpers
        run: |
          dotnet run --file scripts/CheckDocReferences.cs
          dotnet run --file scripts/TestCheckDocReferences.cs
          dotnet run --file scripts/TestSelectVerification.cs
          dotnet run --file scripts/TestVerificationGroup.cs -c Release
          dotnet run --file scripts/TestFindCertifiedLibrary.cs
          dotnet run --file scripts/TestLibraryArchive.cs -c Release
          dotnet run --file scripts/TestSummarizeVerification.cs
          dotnet run --file scripts/TestProofCost.cs
          dotnet run --file scripts/TestLeanDiagnostics.cs
          dotnet run --file Tests/ConsumerTraceRetention.cs
          dotnet run --file Tests/FileHashing.cs
          dotnet run --file Tests/BatchInputs.cs
          dotnet run --file Tests/LibraryConfiguration.cs
          dotnet run --file Tests/ConsumerArtifactSnapshot.cs
          dotnet run --file Tests/ConsumerSupportCandidates.cs
          dotnet run --file Tests/PreparedFixtures.cs
      - name: Select affected suites
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: dotnet run --file scripts/SelectVerification.cs -- --event "$EVENT" --base "$BASE" --head "$HEAD" --output "$GITHUB_OUTPUT"

  prepare:
    name: Prepare certified Lean library
    needs: select
    if: needs.select.outputs.has-suites == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Reads earlier runs' jobs, logs and library artifacts.
      actions: read
      # Identifies the same-repository PR merged by a push commit.
      pull-requests: read
    outputs:
      manifest-sha256: ${{ steps.certify.outputs.manifest-sha256 }}
      archive-sha256: ${{ steps.pack-library.outputs.archive-sha256 || steps.donor.outputs.archive-sha256 }}
      artifact-id: ${{ steps.library-artifact.outputs.artifact-id || steps.donor.outputs.artifact-id }}
      artifact-run-id: ${{ steps.library-artifact.outputs.artifact-id && github.run_id || steps.donor.outputs.run-id }}
      toolchain-artifact-id: ${{ steps.toolchain-artifact.outputs.artifact-id }}
      toolchain-sha256: ${{ steps.pack-toolchain.outputs.sha256 }}
      toolchain-pin-sha256: ${{ steps.pack-toolchain.outputs.pin-sha256 }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      LEANCIL_TRACE_DIRECTORY: ${{ github.workspace }}/artifacts/verification-traces
      LEANCIL_SUITE: prepare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The first parent is the main commit this checkout builds on.
          fetch-depth: 2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install pinned elan
        timeout-minutes: 6
        shell: bash
        run: |
          archive="$RUNNER_TEMP/elan.tar.gz"
          curl --fail --location --retry 1 --retry-all-errors --retry-delay 30 --max-time 150 \
            https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output "$archive"
          echo "42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/elan-installer"
          tar -xzf "$archive" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --default-toolchain none --no-modify-path
          "$HOME/.elan/bin/elan" --version
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install Lean toolchain
        id: lean
        timeout-minutes: 3
        # The toolchain download fails transiently; retry once after a pause.
        continue-on-error: true
        shell: bash
        run: |
          lean --version
          lake --version
      - name: Wait before retrying the Lean toolchain install
        if: steps.lean.outcome == 'failure'
        shell: bash
        run: sleep 30
      - name: Retry Lean toolchain install
        if: steps.lean.outcome == 'failure'
        timeout-minutes: 3
        shell: bash
        run: |
          lean --version
          lake --version
      - name: Package the installed Lean toolchain
        id: pack-toolchain
        shell: bash
        run: |
          prefix="$(lean --print-prefix)"
          case "$prefix" in
            "$HOME/.elan/toolchains/"*) ;;
            *) echo "Unexpected Lean installation: $prefix" >&2; exit 1 ;;
          esac
          test -x "$prefix/bin/leanchecker"
          archive="$RUNNER_TEMP/lean-toolchain.tar.zst"
          tar -C "$HOME" -cf - .elan/bin .elan/settings.toml "${prefix#"$HOME/"}" | zstd -T2 -6 -q > "$archive"
          echo "sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "pin-sha256=$(sha256sum lean-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Upload the installed Lean toolchain
        id: toolchain-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lean-toolchain.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      # A PR-scoped cache does not authenticate its producer or its native audit executable. A run of
      # this commit, a same-PR ancestor, an identical merged tree, or main logged the library digest.
      - name: Find an authenticated library from this PR or main
        id: donor
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          dotnet run --file scripts/FindCertifiedLibrary.cs -- --repository "$GITHUB_REPOSITORY"
          --workflow verification.yml --head "$HEAD_SHA" --base "$(git rev-parse HEAD^1)" --output "$GITHUB_OUTPUT"
          --pull-request "$PR_NUMBER"
          --event "$GITHUB_EVENT_NAME"
      - name: Download the donated certified library
        id: donated
        if: steps.donor.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.donor.outputs.artifact-id }}
          run-id: ${{ steps.donor.outputs.run-id }}
          github-token: ${{ github.token }}
          path: artifacts/library-download
      - name: Restore the authenticated donated library
        id: restored
        if: steps.donated.outcome == 'success'
        continue-on-error: true
        env:
          MANIFEST_SHA256: ${{ steps.donor.outputs.manifest-sha256 }}
          ARCHIVE_SHA256: ${{ steps.donor.outputs.archive-sha256 }}
        run: >-
          dotnet run --file scripts/LibraryArchive.cs -c Release -- restore artifacts/library-download
          artifacts/certified-library "$MANIFEST_SHA256" "$ARCHIVE_SHA256"
      # Reuse rechecks the source binding and every file against the producer's digest. It skips kernel
      # replay only when run metadata shows the producer ran reviewed producer code, which replayed it.
      # Any mismatch tries an incremental build, then a fresh one.
      - name: Reuse a donated library or build it from source
        id: certify
        shell: bash
        env:
          DONATED_SHA256: ${{ steps.restored.outcome == 'success' && steps.donor.outputs.manifest-sha256 || '' }}
          REVIEWED_PRODUCER: ${{ steps.donor.outputs.reviewed-producer }}
        run: |
          mkdir -p artifacts
          set -o pipefail
          producer=()
          if [ "$REVIEWED_PRODUCER" = true ]; then producer=(--producer-replayed); fi
          if [ -n "$DONATED_SHA256" ] && dotnet run --file scripts/PrepareLibrary.cs -- artifacts/certified-library \
              --reuse "$DONATED_SHA256" "${producer[@]}" 2>&1 | tee artifacts/verification.log; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$DONATED_SHA256" ]; then
              mv artifacts/certified-library artifacts/certified-library-donor
              if dotnet run --file scripts/PrepareLibrary.cs -- artifacts/certified-library \
                  --incremental artifacts/certified-library-donor "$DONATED_SHA256" \
                  2>&1 | tee -a artifacts/verification.log; then
                exit 0
              fi
            fi
            rm -rf artifacts/certified-library
            dotnet run --file scripts/PrepareLibrary.cs -- artifacts/certified-library 2>&1 | tee -a artifacts/verification.log
          fi
      - name: Package the certified library
        id: pack-library
        if: steps.certify.outputs.reused != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          MANIFEST_SHA256: ${{ steps.certify.outputs.manifest-sha256 }}
        run: >-
          dotnet run --file scripts/LibraryArchive.cs -c Release -- pack artifacts/certified-library
          artifacts/certified-library.tar.zst "$MANIFEST_SHA256"
      - name: Upload certified library for this workflow attempt
        id: library-artifact
        # Main must remain a donor for later PRs even when it reused a merged PR's library.
        if: steps.certify.outputs.reused != 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: certified-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/certified-library.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Summarize preparation timings
        if: always()
        run: dotnet run --file scripts/SummarizeVerification.cs -- --root artifacts/verification-traces --output artifacts/stage-timings.json --markdown artifacts/stage-timings.md --github-summary
      - name: Upload preparation transcripts and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-results-prepare-${{ github.run_attempt }}
          path: |
            artifacts/verification.log
            artifacts/verification-traces/
            artifacts/stage-timings.*
          if-no-files-found: ignore
          retention-days: 14

  tools:
    name: Build extractor, examples and shared fixtures
    needs: select
    if: needs.select.outputs.has-suites == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.tools-artifact.outputs.artifact-id }}
      fixture-manifest-sha256: ${{ steps.fixtures.outputs.manifest-sha256 }}
      fixture-checksums-sha256: ${{ steps.fixtures.outputs.checksums-sha256 }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the extractor and example assembly
        run: dotnet run --file scripts/Test.cs -- --build-tools
      - name: Build shared verification fixtures
        id: fixtures
        run: dotnet run --file scripts/PrepareFixtures.cs -- artifacts/verification-fixtures
      - name: Upload the built tools for this workflow attempt
        id: tools-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-tools-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Extractor/bin
            Examples/Assembly/bin
            artifacts/verification-fixtures
          if-no-files-found: error
          retention-days: 14

  suites:
    name: Verify (${{ matrix.suite }})
    needs: [select, prepare, tools]
    if: needs.select.outputs.has-suites == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The certified library may be an artifact of the earlier run that donated it.
      actions: read
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # Longest measured suites start first; eight runners bound concurrent load.
      max-parallel: 8
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      LEANCIL_CERTIFIED_LIBRARY: ${{ github.workspace }}/artifacts/certified-library
      # The trusted digest is a successful producer-job output, never artifact text.
      LEANCIL_CERTIFIED_LIBRARY_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
      LEANCIL_TRACE_DIRECTORY: ${{ github.workspace }}/artifacts/verification-traces
      LEANCIL_SUITE: ${{ matrix.suite }}
      LEANCIL_PREBUILT_TOOLS: true
      LEANCIL_FIXTURE_ROOT: ${{ github.workspace }}
      LEANCIL_FIXTURE_MANIFEST: ${{ github.workspace }}/artifacts/verification-fixtures/manifest.json
      LEANCIL_FIXTURE_MANIFEST_SHA256: ${{ needs.tools.outputs.fixture-manifest-sha256 }}

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Consumer tests fetch this checkout as a pinned local Git dependency.
          # Git refuses shallow source roots when Lake materializes that dependency.
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the successful producer job's Lean toolchain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.toolchain-artifact-id }}
          path: ${{ runner.temp }}/lean-toolchain
      - name: Restore the authenticated Lean toolchain
        shell: bash
        env:
          TOOLCHAIN_SHA256: ${{ needs.prepare.outputs.toolchain-sha256 }}
          TOOLCHAIN_PIN_SHA256: ${{ needs.prepare.outputs.toolchain-pin-sha256 }}
        run: |
          archive="$RUNNER_TEMP/lean-toolchain/lean-toolchain.tar.zst"
          echo "$TOOLCHAIN_PIN_SHA256  lean-toolchain" | sha256sum --check --status
          echo "$TOOLCHAIN_SHA256  $archive" | sha256sum --check --status
          tar --zstd -xf "$archive" --no-same-owner -C "$HOME"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Download the successful producer job's certified library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Failed-job reruns retain the successful producer's immutable artifact ID.
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          run-id: ${{ needs.prepare.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          path: artifacts/library-download

      - name: Download this run's extractor and example assembly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.tools.outputs.artifact-id }}
          path: .

      - name: Authenticate prepared executables
        shell: bash
        env:
          FIXTURE_CHECKSUMS_SHA256: ${{ needs.tools.outputs.fixture-checksums-sha256 }}
        run: |
          echo "$FIXTURE_CHECKSUMS_SHA256  artifacts/verification-fixtures/checksums.sha256" | sha256sum --check --status
          sha256sum --check --status artifacts/verification-fixtures/checksums.sha256

      - name: Restore the authenticated certified library
        env:
          ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: >-
          dotnet artifacts/verification-fixtures/LibraryArchive/LibraryArchive.dll restore artifacts/library-download
          artifacts/certified-library "$LEANCIL_CERTIFIED_LIBRARY_SHA256" "$ARCHIVE_SHA256"

      - name: Run verification suite
        shell: bash
        env:
          VERIFICATION_SUITES: ${{ toJSON(matrix.suites) }}
        run: |
          mkdir -p artifacts
          set -o pipefail
          dotnet artifacts/verification-fixtures/RunVerificationGroup/RunVerificationGroup.dll 2>&1 | tee artifacts/verification.log

      # Proof cost is no part of the suite's result: a measurement that fails leaves no rows, which
      # fails the comparison and not this job.
      - name: Measure the proof cost of the verified outputs
        if: matrix.proof
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: >-
          dotnet artifacts/verification-fixtures/ProofCost/ProofCost.dll measure --tree .
          --library artifacts/certified-library --artifacts artifacts --jobs "$(nproc)"
          --output "$RUNNER_TEMP/proof-cost/$LEANCIL_SUITE.json"
      - name: Upload the measured proof cost rows
        if: matrix.proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-cost-head-rows-${{ matrix.suite }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-cost/${{ matrix.suite }}.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Summarize verification timings
        if: always()
        run: dotnet run --file scripts/SummarizeVerification.cs -- --root artifacts/verification-traces --output artifacts/stage-timings.json --markdown artifacts/stage-timings.md --github-summary

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-results-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            artifacts/verification.log
            artifacts/verification-*.log
            artifacts/verification-traces/
            artifacts/stage-timings.*
            artifacts/test-results-*.json
            artifacts/**/verified.json
            artifacts/**/identity.json
            artifacts/**/*.lean
            !artifacts/certified-library/**
            !artifacts/suite-caches/**
          if-no-files-found: ignore
          retention-days: 14

  cost-base:
    name: Build the merge base for proof cost
    needs: [select, prepare]
    # A push to main has no merge base to compare with. A manual run compares its tree with itself.
    if: github.event_name != 'push' && needs.select.outputs.has-suites == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Reads the jobs, logs and rows of main's run of the merge base, and the head library's run.
      actions: read
    outputs:
      sources: ${{ steps.sources.outputs.sources }}
      missing: ${{ steps.rows.outputs.missing }}
      manifest-sha256: ${{ steps.certify.outputs.manifest-sha256 || needs.prepare.outputs.manifest-sha256 }}
      archive-sha256: ${{ steps.pack-library.outputs.archive-sha256 || needs.prepare.outputs.archive-sha256 }}
      artifact-id: ${{ steps.library-artifact.outputs.artifact-id || needs.prepare.outputs.artifact-id }}
      artifact-run-id: ${{ steps.library-artifact.outputs.artifact-id && github.run_id || needs.prepare.outputs.artifact-run-id }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The first parent of a PR's merge commit is the base it merges into.
      BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Select what the change can affect
        id: sources
        shell: bash
        env:
          MATRIX: ${{ needs.select.outputs.matrix }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            dotnet run --file scripts/ProofCost.cs -- sources --matrix "$MATRIX" --tree . --base "$BASE" \
              --output "$GITHUB_OUTPUT"
          else
            dotnet run --file scripts/ProofCost.cs -- sources --matrix "$MATRIX" --output "$GITHUB_OUTPUT"
          fi
      # The push to main of the merge base measured these rows with main's code and logged their
      # digest. Without them, or for a source they lack, the base is measured in this run.
      - name: Find the rows main published for the merge base
        id: published
        if: steps.sources.outputs.sources != '[]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          dotnet run --file scripts/FindCertifiedLibrary.cs -- --repository "$GITHUB_REPOSITORY"
          --workflow verification.yml --proof-cost-rows "$(git rev-parse "$BASE")" --output "$GITHUB_OUTPUT"
      - name: Download the published rows
        id: published-rows
        if: steps.published.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.published.outputs.artifact-id }}
          run-id: ${{ steps.published.outputs.run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published-rows
      - name: Take the published rows of the selected sources
        id: rows
        if: steps.sources.outputs.sources != '[]'
        shell: bash
        env:
          SOURCES: ${{ steps.sources.outputs.sources }}
          PUBLISHED_SHA256: ${{ steps.published-rows.outcome == 'success' && steps.published.outputs.sha256 || '' }}
        run: |
          published=()
          if [ -n "$PUBLISHED_SHA256" ]; then
            published=(--published "$RUNNER_TEMP/published-rows/proof-cost-rows.json" --sha256 "$PUBLISHED_SHA256")
          fi
          dotnet run --file scripts/ProofCost.cs -- base-rows --sources "$SOURCES" \
            --output-rows "$RUNNER_TEMP/base-rows" "${published[@]}" --output "$GITHUB_OUTPUT"
      - name: Upload the published rows as this run's base
        if: steps.sources.outputs.sources != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-cost-base-rows-published-${{ github.run_attempt }}
          path: ${{ runner.temp }}/base-rows/*.json
          if-no-files-found: ignore
          retention-days: 14
      # Identical library inputs let the merge base use the head's certified library as it is.
      - name: Compare the library inputs of the merge base and the head
        id: library
        if: steps.rows.outputs.missing != '' && steps.rows.outputs.missing != '[]'
        shell: bash
        run: |
          if git diff --quiet "$BASE" HEAD -- CIL CIL.lean lean-toolchain lake-manifest.json lakefile.toml; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download the successful producer job's Lean toolchain
        if: steps.library.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.toolchain-artifact-id }}
          path: ${{ runner.temp }}/lean-toolchain
      - name: Restore the authenticated Lean toolchain
        if: steps.library.outputs.build == 'true'
        shell: bash
        env:
          TOOLCHAIN_SHA256: ${{ needs.prepare.outputs.toolchain-sha256 }}
          TOOLCHAIN_PIN_SHA256: ${{ needs.prepare.outputs.toolchain-pin-sha256 }}
        run: |
          archive="$RUNNER_TEMP/lean-toolchain/lean-toolchain.tar.zst"
          echo "$TOOLCHAIN_PIN_SHA256  lean-toolchain" | sha256sum --check --status
          echo "$TOOLCHAIN_SHA256  $archive" | sha256sum --check --status
          tar --zstd -xf "$archive" --no-same-owner -C "$HOME"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download the head's certified library
        if: steps.library.outputs.build == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          run-id: ${{ needs.prepare.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          path: artifacts/library-download
      # The merge base's own scripts build its library, starting from the head's unchanged modules.
      - name: Build the merge base library from the head's
        id: certify
        if: steps.library.outputs.build == 'true'
        shell: bash
        env:
          HEAD_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
          HEAD_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
        run: |
          dotnet run --file scripts/LibraryArchive.cs -c Release -- restore artifacts/library-download \
            "$RUNNER_TEMP/head-library" "$HEAD_MANIFEST_SHA256" "$HEAD_ARCHIVE_SHA256"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          cd "$RUNNER_TEMP/base"
          mkdir -p artifacts
          if ! dotnet run --file scripts/PrepareLibrary.cs -- artifacts/certified-library \
              --incremental "$RUNNER_TEMP/head-library" "$HEAD_MANIFEST_SHA256"; then
            rm -rf artifacts/certified-library
            dotnet run --file scripts/PrepareLibrary.cs -- artifacts/certified-library
          fi
      # Restore reads the archive by the producer's file name, so the merge base's keeps that name.
      - name: Package the merge base library
        id: pack-library
        if: steps.library.outputs.build == 'true'
        env:
          MANIFEST_SHA256: ${{ steps.certify.outputs.manifest-sha256 }}
        run: >-
          dotnet run --file scripts/LibraryArchive.cs -c Release -- pack
          "$RUNNER_TEMP/base/artifacts/certified-library"
          "$RUNNER_TEMP/base-library/certified-library.tar.zst" "$MANIFEST_SHA256"
      - name: Upload the merge base library for this workflow attempt
        id: library-artifact
        if: steps.library.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-cost-base-library-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/base-library/certified-library.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Runs beside the suites: it needs the merge base's library and nothing the head verified.
  cost-base-rows:
    name: Measure the merge base (${{ matrix.source }})
    needs: [prepare, cost-base]
    if: needs.cost-base.outputs.missing != '' && needs.cost-base.outputs.missing != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      # The library may be an artifact of the earlier run that donated it.
      actions: read
    strategy:
      fail-fast: false
      # GitHub validates the matrix even when the job is skipped.
      matrix:
        source: ${{ fromJSON(needs.cost-base.outputs.missing || '["libraries"]') }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SOURCE: ${{ matrix.source }}
      BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || 'HEAD' }}
      BASE_MANIFEST_SHA256: ${{ needs.cost-base.outputs.manifest-sha256 }}
      BASE_ARCHIVE_SHA256: ${{ needs.cost-base.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Consumer tests fetch each checkout as a pinned local Git dependency, which refuses shallow roots.
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download the successful producer job's Lean toolchain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.toolchain-artifact-id }}
          path: ${{ runner.temp }}/lean-toolchain
      - name: Restore the authenticated Lean toolchain
        shell: bash
        env:
          TOOLCHAIN_SHA256: ${{ needs.prepare.outputs.toolchain-sha256 }}
          TOOLCHAIN_PIN_SHA256: ${{ needs.prepare.outputs.toolchain-pin-sha256 }}
        run: |
          archive="$RUNNER_TEMP/lean-toolchain/lean-toolchain.tar.zst"
          echo "$TOOLCHAIN_PIN_SHA256  lean-toolchain" | sha256sum --check --status
          echo "$TOOLCHAIN_SHA256  $archive" | sha256sum --check --status
          tar --zstd -xf "$archive" --no-same-owner -C "$HOME"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download the merge base's certified library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.cost-base.outputs.artifact-id }}
          run-id: ${{ needs.cost-base.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/base-library-download
      - name: Check out the merge base and restore its library
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          mkdir -p "$RUNNER_TEMP/base/artifacts" "$RUNNER_TEMP/proof-cost"
          dotnet run --file scripts/LibraryArchive.cs -c Release -- restore "$RUNNER_TEMP/base-library-download" \
            "$RUNNER_TEMP/base/artifacts/certified-library" "$BASE_MANIFEST_SHA256" "$BASE_ARCHIVE_SHA256"
      # The merge base's own runner verifies the suite, which leaves its extractions and proofs to measure.
      - name: Verify the suite at the merge base
        if: matrix.source != 'libraries'
        shell: bash
        run: |
          log="$RUNNER_TEMP/proof-cost/$SOURCE-base-suite.log"
          if ! (cd "$RUNNER_TEMP/base" && LEANCIL_CERTIFIED_LIBRARY="$RUNNER_TEMP/base/artifacts/certified-library" \
              LEANCIL_CERTIFIED_LIBRARY_SHA256="$BASE_MANIFEST_SHA256" \
              dotnet run --file scripts/Test.cs -- --suite "$SOURCE") > "$log" 2>&1; then
            tail -n 40 "$log"
            echo "::warning::The $SOURCE suite did not pass at the merge base; its proofs have no base to compare."
          fi
      # A suite the base does not have, or cannot pass, leaves a measurement without rows.
      - name: Measure the merge base
        shell: bash
        run: |
          if [ "$SOURCE" = libraries ]; then measured=(--libraries); else measured=(--artifacts "$RUNNER_TEMP/base/artifacts"); fi
          dotnet run --file scripts/ProofCost.cs -- measure --tree "$RUNNER_TEMP/base" \
            --library "$RUNNER_TEMP/base/artifacts/certified-library" "${measured[@]}" --jobs "$(nproc)" \
            --output "$RUNNER_TEMP/proof-cost/$SOURCE.json"
      - name: Upload the merge base's rows
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-cost-base-rows-${{ matrix.source }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof-cost/*.json
            ${{ runner.temp }}/proof-cost/*.log
          if-no-files-found: ignore
          retention-days: 14

  cost-libraries:
    name: Measure the test libraries for proof cost
    needs: [prepare, cost-base]
    # A push to main measures them for later pull requests to take as their base.
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' && (github.event_name == 'push' ||
      contains(fromJSON(needs.cost-base.outputs.sources || '[]'), 'libraries')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The library may be an artifact of the earlier run that donated it.
      actions: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      HEAD_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest-sha256 }}
      HEAD_ARCHIVE_SHA256: ${{ needs.prepare.outputs.archive-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download the successful producer job's Lean toolchain
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.toolchain-artifact-id }}
          path: ${{ runner.temp }}/lean-toolchain
      - name: Restore the authenticated Lean toolchain
        shell: bash
        env:
          TOOLCHAIN_SHA256: ${{ needs.prepare.outputs.toolchain-sha256 }}
          TOOLCHAIN_PIN_SHA256: ${{ needs.prepare.outputs.toolchain-pin-sha256 }}
        run: |
          archive="$RUNNER_TEMP/lean-toolchain/lean-toolchain.tar.zst"
          echo "$TOOLCHAIN_PIN_SHA256  lean-toolchain" | sha256sum --check --status
          echo "$TOOLCHAIN_SHA256  $archive" | sha256sum --check --status
          tar --zstd -xf "$archive" --no-same-owner -C "$HOME"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download the head's certified library
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          run-id: ${{ needs.prepare.outputs.artifact-run-id }}
          github-token: ${{ github.token }}
          path: artifacts/library-download
      - name: Measure the test libraries
        shell: bash
        run: |
          dotnet run --file scripts/LibraryArchive.cs -c Release -- restore artifacts/library-download \
            artifacts/certified-library "$HEAD_MANIFEST_SHA256" "$HEAD_ARCHIVE_SHA256"
          dotnet run --file scripts/ProofCost.cs -- measure --tree . --library artifacts/certified-library \
            --libraries --jobs "$(nproc)" --output "$RUNNER_TEMP/proof-cost/libraries.json"
      - name: Upload the measured proof cost rows
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-cost-head-rows-libraries-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-cost/libraries.json
          if-no-files-found: error
          retention-days: 14

  # Later pull requests find this job by name and take the digest it logs as their base's.
  cost-publish:
    name: Publish proof cost rows
    needs: [suites, cost-libraries]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.suites.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download the rows this run measured
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proof-cost-head-rows-*
          merge-multiple: true
          path: ${{ runner.temp }}/head-rows
      - name: Gather the rows and log their digest
        run: >-
          dotnet run --file scripts/ProofCost.cs -- publish --rows "$RUNNER_TEMP/head-rows"
          --output "$RUNNER_TEMP/published/proof-cost-rows.json"
      - name: Upload the rows for later pull requests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-cost-rows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/published/proof-cost-rows.json
          if-no-files-found: error
          retention-days: 14

  # The only proof cost job that waits for the suites: it measures nothing.
  proof-cost:
    name: Proof cost
    needs: [cost-base, cost-base-rows, cost-libraries, suites]
    if: >-
      ${{ !cancelled() && needs.cost-base.outputs.sources != '' && needs.cost-base.outputs.sources != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SOURCES: ${{ needs.cost-base.outputs.sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download the merge base's rows, published or measured in this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proof-cost-base-rows-*
          merge-multiple: true
          path: ${{ runner.temp }}/base-rows
      - name: Download the head's rows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proof-cost-head-rows-*
          merge-multiple: true
          path: ${{ runner.temp }}/head-rows
      # Every source is reported before the job fails for any of them.
      - name: Compare proof cost with the merge base
        run: >-
          dotnet run --file scripts/ProofCost.cs -- report --sources "$SOURCES"
          --base-rows "$RUNNER_TEMP/base-rows" --head-rows "$RUNNER_TEMP/head-rows"
          --accepted scripts/proof-cost-accepted.json --output "$RUNNER_TEMP/proof-cost" --github-summary
      - name: Upload proof cost measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-cost-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/proof-cost/
            ${{ runner.temp }}/base-rows/
            ${{ runner.temp }}/head-rows/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    name: Build and verify
    needs: [select, prepare, tools, suites]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Download this run's verification transcripts and timings
        if: needs.select.outputs.has-suites == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-results-*
          path: artifacts/collected
      - name: Summarize all verification stages
        if: needs.select.outputs.has-suites == 'true'
        run: dotnet run --file scripts/SummarizeVerification.cs -- --root artifacts/collected --output artifacts/all-stage-timings.json --markdown artifacts/all-stage-timings.md --github-summary
      - name: Upload combined stage timings
        if: always() && needs.select.outputs.has-suites == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-stage-timings-${{ github.run_attempt }}
          path: artifacts/all-stage-timings.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Require successful selection and every selected suite to pass
        if: always()
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          HAS_SUITES: ${{ needs.select.outputs.has-suites }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TOOLS_RESULT: ${{ needs.tools.result }}
          SUITES_RESULT: ${{ needs.suites.result }}
        run: |
          test "$SELECT_RESULT" = success
          if [ "$HAS_SUITES" = true ]; then
            test "$PREPARE_RESULT" = success
            test "$TOOLS_RESULT" = success
            test "$SUITES_RESULT" = success
          else
            test "$HAS_SUITES" = false
            test "$PREPARE_RESULT" = skipped
            test "$TOOLS_RESULT" = skipped
            test "$SUITES_RESULT" = skipped
          fi
